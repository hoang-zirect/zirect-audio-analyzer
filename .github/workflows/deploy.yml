name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện
        run: npm ci
      - name: Kiểm tra TypeScript
        run: npm run lint
      - name: Chạy unit test
        run: npm test
      - name: Build website kiểm tra
        run: npm run build
      - name: Kiểm tra Essentia worker
        run: npm run test:essentia-runtime
      - name: Kiểm tra đường dẫn GitHub Pages
        run: npm run build -- --base=/zirect-audio-analyzer/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện
        run: npm ci
      - name: Build đúng đường dẫn GitHub Pages
        run: npm run build -- --base=/zirect-audio-analyzer/
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Đăng website
        id: deployment
        uses: actions/deploy-pages@v4
